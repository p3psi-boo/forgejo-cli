when:
  - event: tag
steps:
  compile-linux-x86_64:
    image: debian:trixie-slim
    environment:
      BUILD_TYPE: "release ci"
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates wget xz-utils
      - wget -q https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
      - tar -xf zig-x86_64-linux-0.17.0.tar.xz
      - export PATH="$PWD/zig-x86_64-linux-0.17.0:$PATH"
      - zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-gnu -Dbuild-type="release ci" --prefix ./prefix-x86_64-linux
      - mkdir -p target/x86_64-unknown-linux-gnu/release
      - cp prefix-x86_64-linux/bin/fj target/x86_64-unknown-linux-gnu/release/fj
      - mkdir -p zig-out/bin
      - cp prefix-x86_64-linux/bin/fj zig-out/bin/fj
      - strip zig-out/bin/fj
  compile-linux-aarch64:
    image: debian:trixie-slim
    environment:
      BUILD_TYPE: "release ci"
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates wget xz-utils binutils-aarch64-linux-gnu
      - wget -q https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
      - tar -xf zig-x86_64-linux-0.17.0.tar.xz
      - export PATH="$PWD/zig-x86_64-linux-0.17.0:$PATH"
      - zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux-gnu -Dbuild-type="release ci" --prefix ./prefix-aarch64-linux
      - mkdir -p target/aarch64-unknown-linux-gnu/release
      - cp prefix-aarch64-linux/bin/fj target/aarch64-unknown-linux-gnu/release/fj
      - aarch64-linux-gnu-strip target/aarch64-unknown-linux-gnu/release/fj
  compile-windows:
    image: debian:trixie-slim
    environment:
      BUILD_TYPE: "release ci"
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates wget xz-utils
      - wget -q https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
      - tar -xf zig-x86_64-linux-0.17.0.tar.xz
      - export PATH="$PWD/zig-x86_64-linux-0.17.0:$PATH"
      - zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-windows-gnu -Dbuild-type="release ci" --prefix ./prefix-windows
      - mkdir -p target/x86_64-pc-windows-gnu/release
      - cp prefix-windows/bin/fj.exe target/x86_64-pc-windows-gnu/release/fj.exe
  create-archives:
    image: code.cartoon-aa.xyz/ci/alpine-zip:3.22
    commands:
      - cd target/x86_64-pc-windows-gnu/release
      - zip ../../../forgejo-cli-x86_64-windows.zip fj.exe
      - cd ../../..
      - tar -czf forgejo-cli-x86_64-linux.tar.gz -C target/x86_64-unknown-linux-gnu/release fj
      - tar -czf forgejo-cli-aarch64-linux.tar.gz -C target/aarch64-unknown-linux-gnu/release fj
  publish-container:
    image: code.cartoon-aa.xyz/ci/plugin-kaniko:2.1.0
    settings:
      repo: ${CI_REPO_OWNER,,}/${CI_REPO_NAME}
      platforms: linux/amd64
      auto_tag: true
      registry: ${CI_FORGE_URL##https://}
      username: ${CI_REPO_OWNER}
      password:
        from_secret: token
  publish-builds:
    image: codeberg.org/forgejo-contrib/forgejo-cli:latest
    pull: true
    environment:
      TOKEN:
        from_secret: token
    commands:
      - export FORGE_HOST=$(echo $CI_FORGE_URL | sed -E 's_^https?://__')
      - fj --host $CI_FORGE_URL auth add-token $TOKEN
      - fj release --repo $CI_REPO_URL asset create $CI_COMMIT_TAG forgejo-cli-x86_64-windows.zip
      - fj release --repo $CI_REPO_URL asset create $CI_COMMIT_TAG forgejo-cli-x86_64-linux.tar.gz
      - fj release --repo $CI_REPO_URL asset create $CI_COMMIT_TAG forgejo-cli-aarch64-linux.tar.gz
      - fj auth logout $FORGE_HOST
