when:
  - event: manual
  - event: pull_request
steps:
  check:
    image: debian:trixie-slim
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates wget xz-utils
      - wget -q https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
      - tar -xf zig-x86_64-linux-0.17.0.tar.xz
      - export PATH="$PWD/zig-x86_64-linux-0.17.0:$PATH"
      - zig version
      - zig build
      - zig build test
      - zig fmt --check src build.zig build.zig.zon
      # Generating completions parses the top-level command surface.
      - zig-out/bin/fj completion bash
      - zig-out/bin/fj --help
      - zig-out/bin/fj version
